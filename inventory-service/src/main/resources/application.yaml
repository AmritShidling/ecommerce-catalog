server:
  port: 8082
spring:
  eureka:
    client:
      healthCheck:
        enabled: true
      service-url:
        defaultZone: http://localhost:8761/eureka
    instance:
      prefer-ip-address: true
      status-page-url-path: /actuator/info
      health-check-url-path: /actuator/health
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory_db
    password: password
    username: user
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  kafka:
    listener:
      observation-enabled: true
    consumer:
      bootstrap-servers: localhost:9092
      group-id: inventory-group-v3
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # This part is critical to avoid the constructor failure:
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.zenith.inventory.inventory_service.DTO.ProductCreatedEvent"
    bootstrap-servers: localhost:9092
  application:
    name: "inventory-service"
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  oltp:
    matrics:
      export:
        enabled: true
  defaults:
    metrics:
      export:
        enabled: false
otel:
  service:
    name: inventory-service
  resource:
    attributes:
      service.name: inventory-service
logging:
  pattern:
    # This specific format is what the OTEL starter looks for to inject IDs
    level: "%5p [${spring.application.name:-}, %X{traceId:-}, %X{spanId:-}]"